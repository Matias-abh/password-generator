<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Password Generator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <script type="module" src="./js/app.js"></script>

</head>

<body>
  <main class="app">

    <section class="view" data-view="generator">

      <header class="header">
        <div class="header__content">
          <div class="header__group">
            <svg class="header__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z" />
              <circle cx="16.5" cy="7.5" r=".5" fill="currentColor" />
            </svg>
            <h1 class="header__title">Password Generator</h1>
          </div>
          <p class="header__subtitle">Generate a secure password instantly</p>
        </div>
      </header>

      <section class="password-generator">
        <div class="password-generator__current-password">
          <span class="password-generator__label">Current password</span>
          <span class="password-generator__current-length"></span>
        </div>
        <div class="password-generator__result">
          <input type="text" id="input" class="password-generator__password-display" placeholder="Create password"
            readonly>
          <button class="password-generator__copy-btn">
            <i class="fa-regular fa-copy"></i>
          </button>
        </div>

        <div class="password-strength">
          <div class="password-strength__bars">
            <span class="password-strength__bar"></span>
            <span class="password-strength__bar"></span>
            <span class="password-strength__bar"></span>
            <span class="password-strength__bar"></span>
          </div>
          <span class="password-strength__label"></span>
        </div>

        <div class="password-generator__controls">

          <div class="password-generator__length">
            <div class="password-generator__length-header">
              <label for="password-length" class="password-generator__length-label">Length</label>
              <span class="password-generator__length-value"></span>
            </div>
            <div class="password-generator__slider-container">
              <input type="range" id="password-length" class="slider" min="4" max="32" value="18" />
              <div class="password-generator__range-indicators">
                <span class="password-generator__range-value">4</span>
                <span class="password-generator__range-value">32</span>
              </div>
            </div>
          </div>

          <fieldset class="password-generator__settings">
            <legend class="password-generator__settings-title">Settings</legend>

            <label class="settings-option">
              <span class="settings-option__label">Include Uppercase</span>
              <div class="toggle">
                <input type="checkbox" id="include-uppercase" class="option-checkbox toggle__input" />
                <span class="toggle__track">
                  <span class="toggle__thumb"></span>
                </span>
              </div>
            </label>

            <label class="settings-option">
              <span class="settings-option__label">Include Lowercase</span>
              <div class="toggle">
                <input type="checkbox" id="include-lowercase" class="option-checkbox toggle__input" />
                <span class="toggle__track">
                  <span class="toggle__thumb"></span>
                </span>
              </div>
            </label>

            <label class="settings-option">
              <span class="settings-option__label">Include Numbers</span>
              <div class="toggle">
                <input type="checkbox" id="include-number" class="option-checkbox toggle__input" />
                <span class="toggle__track">
                  <span class="toggle__thumb"></span>
                </span>
              </div>
            </label>

            <label class="settings-option">
              <span class="settings-option__label">Include Symbols</span>
              <div class="toggle">
                <input type="checkbox" id="include-symbol" class="option-checkbox toggle__input" />
                <span class="toggle__track">
                  <span class="toggle__thumb"></span>
                </span>
              </div>
            </label>
          </fieldset>

        </div>
        <button disabled class="password-generator__generate-btn">Generate Password</button>
      </section>

    </section>

    <section class="view hidden" data-view="history">
      <header class="history__header">
        <div class="history__header__group">
          <svg class="histoy__header__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
            <path d="M12 7v5l4 2" />
          </svg>
          <h2 class="history__title">History</h2>
        </div>
        <span class="history__count"></span>
      </header>
      <div class="history">
        <ul class="history__list">
        </ul>
      </div>
      <button class="history__delete-btn">Delete history</button>
    </section>

  </main>

  <nav class="button-nav">
    <button class="button-nav__btn" data-target="generator">
      <svg class="button-nav__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z" />
        <circle cx="16.5" cy="7.5" r=".5" fill="currentColor" />
      </svg>
      <span class="button-nav__text">Generator</span>
    </button>
    <button class="button-nav__btn" data-target="history">
      <svg class="button-nav__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
        <path d="M12 7v5l4 2" />
      </svg>
      <span class="button-nav__text">History</span>
    </button>
  </nav>

  <div class="toast hidden">Copied!</div>

  <div class="modal hidden">
    <div class="modal__content">
      <h2 class="modal__title">Delete history</h2>
      <p class="modal__description">This action cannot be undone. Are you sure?</p>

      <div class="modal__actions">
        <button class="modal__btn modal__btn--cancel">Cancel</button>
        <button class="modal__btn modal__btn--danger">Delete</button>
      </div>
    </div>
  </div>

</body>

</html>
