<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script type="module" src="./js/app.js"></script>        

</head>
<body>
    <main class="app">
        
        <section class="view" data-view="generator">
            <header class="header">
                <h2 class="header__title">Password Generator</h2>
                <p class="header__subtitle">
                    Generate a secure password instantly
                </p>
            </header>
            <section class="password-generator">
                
                <div class="password-generator__result">
                    <input type="text" id="input" class="password-generator__password-display" placeholder="Create password" readonly>
                    <i class="password-generator__copy-btn fa-regular fa-copy"></i>
                </div>
                <div class="password-strength" ><span class="password-strength__display" ></span>
                    
                </div>
                
                <div class="password-generator__controls">
                    
                    <div class="password-generator__length">
                        <label for="password-length">LENGTH <span class="display-password-length"></span>
                        </label>
                        <input type="range" id="password-length" name="length" min="4" max="32" value=""/>
                    </div>
                    
                    <div class="password-generator__settings">
                        <p class="password-generator__settings-title">SETTINGS</p>
                        <label for="include-uppercase"><span>Include Uppercase</span>
                        </label>
                        <input type="checkbox" id="include-uppercase" class="option-checkbox"/>
                        
                        <label for="include-lowercase"><span>Include Lowercase</span>
                        </label>
                        <input type="checkbox" id="include-lowercase" class="option-checkbox"/>
                        
                        <label for="include-number"><span>Include Numbers</span>
                        </label>
                        <input type="checkbox" id="include-number" class="option-checkbox"/>
                        
                        <label for="include-symbol"><span>Include Symbols</span>
                        </label>
                        <input type="checkbox" id="include-symbol" class="option-checkbox"/>
                    </div>                    
                </div>
                <button disabled class="password-generator__generate-btn">Generate</button>
            </section>
        </section>
            
        <section class="view hidden" data-view="history">
            <div class="history-password">
                <ul class="history-password__ul">
                </ul>
            </div>
            <button class="delete-history-password">Delete history</button>
        </section>

    </main>

    <nav class="button-nav">
        <button class="button-nav__btn" data-target="generator">Gen</button>
        <button class="button-nav__btn" data-target="history">Hist</button>
    </nav>

    <div class="toast hidden">Copied!</div>

</body>
</html>
